<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Vendedor - Rota Diária</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d4ed8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style> body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; } </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
</head>
<body class="bg-gray-100 text-gray-800 pb-24 select-none">

  <!-- CABEÇALHO FIXO -->
  <header class="bg-blue-700 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg leading-tight" id="header-vendedor">Selecione o Vendedor</h1>
        <p class="text-xs text-blue-200" id="header-rota">Aguardando definição de rota...</p>
      </div>
      <button onclick="resetarDadosSimulacao()" class="bg-blue-900 text-[10px] px-2 py-1 rounded border border-blue-400">Resetar</button>
    </div>
  </header>

  <!-- PASSO 1: SELEÇÃO DE VENDEDOR E ROTA DO DIA -->
  <section id="step-config" class="p-4 max-w-md mx-auto space-y-4">
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="font-bold text-gray-700 text-base border-b pb-2">🚚 Configurar Rota do Dia</h2>
      
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Vendedor</label>
        <select id="select-vendedor" onchange="carregarRotasDoVendedor(this.value)" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg font-medium">
          <option value="">Carregando vendedores...</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Selecione a Rota / Dia</label>
        <select id="select-rota" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg font-medium">
          <option value="">Selecione o Vendedor primeiro</option>
        </select>
      </div>

      <button onclick="iniciarRota()" class="w-full bg-blue-600 active:bg-blue-800 text-white font-bold p-4 rounded-xl shadow-lg">
        INICIAR ATENDIMENTOS →
      </button>
    </div>
  </section>

  <!-- PASSO 2: CIDADES (SANFONAS) E CLIENTES -->
  <main id="step-rota" class="p-4 max-w-md mx-auto space-y-3 hidden">
    <div class="flex justify-between items-center mb-1">
      <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Cidades da Rota</span>
      <button onclick="voltarConfig()" class="text-xs text-blue-600 font-semibold underline">Alterar Rota / Vendedor</button>
    </div>
    
    <div class="mb-4 bg-white border border-slate-200 rounded-lg shadow-sm">
  <button onclick="toggleDespesas()" class="w-full flex justify-between items-center p-4 font-bold text-slate-700 bg-slate-100 rounded-t-lg">
    <span>💸 Lançar Despesas do Dia</span>
    <span id="icone-despesa">▼</span>
  </button>
  
  <div id="conteudo-despesas" class="hidden p-4 space-y-3">
    <div class="flex gap-3">
      <div class="w-1/2">
        <label class="block text-xs font-bold text-slate-600 mb-1">Combustível (R$)</label>
        <input type="number" id="despesa_combustivel" class="w-full p-2 border rounded" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="w-1/2">
        <label class="block text-xs font-bold text-slate-600 mb-1">Almoço (R$)</label>
        <input type="number" id="despesa_almoco" class="w-full p-2 border rounded" step="0.01" min="0" placeholder="0.00">
      </div>
    </div>
    
    <div>
      <label class="block text-xs font-bold text-slate-600 mb-1">Outras Despesas (R$)</label>
      <input type="number" id="despesa_outras_valor" class="w-full p-2 border rounded mb-2" step="0.01" min="0" placeholder="0.00">
      
      <label class="block text-xs font-bold text-slate-600 mb-1">Observação (Obrigatório se houver valor)</label>
      <input type="text" id="despesa_outras_obs" class="w-full p-2 border rounded" placeholder="Ex: Pedágio, óleo, conserto...">
    </div>

    <button onclick="salvarDespesas()" class="w-full mt-2 bg-slate-800 text-white font-bold py-2 rounded text-sm">
      Salvar Despesas
    </button>
  </div>
</div>

    <div id="cidades-container" class="space-y-3"></div>
  </main>
  
  <!-- MODAL ESTOQUE INICIAL (BOM DIA) -->
<div id="modalEstoqueInicial" class="hidden fixed inset-0 bg-slate-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
    <h2 class="text-xl font-bold text-slate-800 mb-2">Conferência de Estoque</h2>
    <p class="text-xs text-slate-500 mb-4">Informe o que sobrou de ontem (No Carro) e o que está pegando agora no barracão (Nova Carga).</p>
    
    <div class="space-y-3">
      <!-- 330ml -->
      <div class="flex items-center justify-between gap-2 p-2 bg-slate-50 rounded border border-slate-200">
        <span class="font-bold text-sm w-1/3">330ml</span>
        <input type="number" id="retorno_330ml" placeholder="No Carro" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
        <input type="number" id="carga_330ml" placeholder="Nova Carga" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
      </div>
      <!-- 900ml -->
      <div class="flex items-center justify-between gap-2 p-2 bg-slate-50 rounded border border-slate-200">
        <span class="font-bold text-sm w-1/3">900ml</span>
        <input type="number" id="retorno_900ml" placeholder="No Carro" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
        <input type="number" id="carga_900ml" placeholder="Nova Carga" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
      </div>
      <!-- Uva -->
      <div class="flex items-center justify-between gap-2 p-2 bg-slate-50 rounded border border-slate-200">
        <span class="font-bold text-sm w-1/3">Uva</span>
        <input type="number" id="retorno_uva" placeholder="No Carro" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
        <input type="number" id="carga_uva" placeholder="Nova Carga" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
      </div>
      <!-- Água SG -->
      <div class="flex items-center justify-between gap-2 p-2 bg-slate-50 rounded border border-slate-200">
        <span class="font-bold text-sm w-1/3">Água S/G</span>
        <input type="number" id="retorno_agua" placeholder="No Carro" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
        <input type="number" id="carga_agua" placeholder="Nova Carga" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
      </div>
      <!-- Água CG -->
      <div class="flex items-center justify-between gap-2 p-2 bg-slate-50 rounded border border-slate-200">
        <span class="font-bold text-sm w-1/3">Água C/G</span>
        <input type="number" id="retorno_agua_gas" placeholder="No Carro" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
        <input type="number" id="carga_agua_gas" placeholder="Nova Carga" class="w-1/3 p-2 border rounded text-sm text-center" min="0">
      </div>
    </div>

    <button onclick="salvarEstoqueInicial()" class="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded text-sm transition">
      Confirmar Estoque e Iniciar Rota
    </button>
  </div>
</div>

  <!-- BOTÃO FIXO DE FECHAMENTO -->
  <div id="box-fechamento" class="fixed bottom-0 left-0 right-0 p-3 bg-white border-t border-gray-300 shadow-lg max-w-md mx-auto hidden z-20">
    <button onclick="concluirEBloquearFechamento()" class="w-full bg-blue-900 active:bg-blue-950 text-white font-black p-3.5 rounded-xl text-sm shadow-md">
      🔒 CONCLUIR FECHAMENTO DO DIA
    </button>
  </div>
  

  <!-- MODAL DE VENDA -->
  <div id="modal-venda" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
      
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <h3 class="font-bold text-lg text-gray-900" id="modal-cliente-nome">Nome do Cliente</h3>
        </div>
        <button onclick="fecharModal()" class="text-gray-400 font-bold text-xl px-2">✕</button>
      </div>

      <div class="space-y-3" id="produtos-list"></div>

      <div class="pt-3 border-t space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Forma de Pagamento</label>
          <select id="modal-pagamento" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm font-semibold">
            <option value="Dinheiro">Dinheiro (À Vista)</option>
            <option value="PIX">PIX</option>
            <option value="Nota a Prazo">Nota Assinada (A Prazo)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Observações / Detalhes</label>
          <textarea id="modal-obs" rows="2" placeholder="Ex: Deixou pago nota antiga; trocas..." class="w-full p-2.5 text-xs bg-gray-50 border border-gray-300 rounded-lg"></textarea>
        </div>

        <div class="flex space-x-6 pt-1 bg-gray-50 p-2.5 rounded-lg border border-gray-200">
          <label class="flex items-center space-x-2 text-xs font-bold text-gray-700 cursor-pointer">
            <input type="checkbox" id="chk-nota" class="w-4 h-4 rounded text-blue-600">
            <span>Emitir Nota</span>
          </label>
          <label class="flex items-center space-x-2 text-xs font-bold text-gray-700 cursor-pointer">
            <input type="checkbox" id="chk-boleto" class="w-4 h-4 rounded text-blue-600">
            <span>Gerar Boleto</span>
          </label>
        </div>

        <div class="flex justify-between items-center bg-blue-50 p-3 rounded-lg border border-blue-200">
          <span class="font-bold text-blue-900 text-sm">TOTAL LÍQUIDO:</span>
          <span class="font-black text-blue-700 text-xl" id="modal-total-val">R$ 0,00</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="salvarVenda(false)" class="bg-red-100 text-red-700 font-bold p-3.5 rounded-xl text-sm">Não Comprou</button>
        <button onclick="salvarVenda(true)" class="bg-green-600 text-white font-bold p-3.5 rounded-xl text-sm shadow-md">Salvar Venda</button>
      </div>

    </div>
  </div>

  <script>
    // O Netlify injeta essas variáveis automaticamente se você já cadastrou lá no painel
const SUPABASE_URL = "https://podnijlrofkhcbbqliem.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvZG5pamxyb2ZraGNiYnFsaWVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNjI3NDEsImV4cCI6MjEwNDgzODc0MX0.ezeNX5Ik4XkswxnAwaCIp3hHZyNRjrSEUJICV0N2jtE";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const URL_API = "https://server-sux7.onrender.com/api";
async function salvarClienteAoVivo(dadosCliente) {
  try {
    // Trata a combinação de NOTA e BOLETO para o Painel do Escritório
    let docSolicitado = null;
    if (dadosCliente.precisaNota && dadosCliente.precisaBoleto) {
      docSolicitado = 'NOTA E BOLETO';
    } else if (dadosCliente.precisaNota) {
      docSolicitado = 'NOTA';
    } else if (dadosCliente.precisaBoleto) {
      docSolicitado = 'BOLETO';
    }
    
    const payload = {
      vendedor_nome: dadosCliente.vendedor,
      cliente_id: dadosCliente.clienteId,
      cliente_nome: dadosCliente.clienteNome,
      cidade: dadosCliente.cidade,
      data_atendimento: new Date().toISOString(),
      qtd_330ml: Number(dadosCliente.qtd_330ml || 0),
      qtd_900ml: Number(dadosCliente.qtd_900ml || 0),
      qtd_uva: Number(dadosCliente.qtd_uva || 0),
      qtd_agua_sg: Number(dadosCliente.qtd_agua_sg || 0),
      qtd_agua_cg: Number(dadosCliente.qtd_agua_cg || 0),
      troca_330ml: Number(dadosCliente.troca_330ml || 0),
      troca_900ml: Number(dadosCliente.troca_900ml || 0),
      troca_uva: Number(dadosCliente.troca_uva || 0),
      forma_pagamento: dadosCliente.formaPagamento,
      valor_total: Number(dadosCliente.valorTotal || 0),
      observacao: dadosCliente.observacao || '',
      solicitacao_documento: docSolicitado,
      status: dadosCliente.statusAtendimento || 'CONCLUIDO'
    };

    const { error } = await supabaseClient
      .from('fechamentos')
      .upsert(payload, { onConflict: 'vendedor_nome, cliente_id, data_atendimento' });

    if (error) throw error;
    console.log('Cliente enviado ao vivo para o Supabase!');
  } catch (err) {
    console.error('Erro ao enviar para o Supabase:', err);
  }
}

    
    const PRODUTOS_CATALOGO = [
  { id: '330ML', nome: 'Suco Laranja 330ml', precoPadrao: 5.50 },  
  { id: '900ML', nome: 'Suco Laranja 900ml', precoPadrao: 11.00 },            
  { id: 'UVA', nome: 'Suco Uva 330ml', precoPadrao: 5.50 },
  { id: 'FARDO_SG', nome: 'Fardo Água Sem Gás 500ml (c/ 12)', precoPadrao: 12.00 },
  { id: 'FARDO_CG', nome: 'Fardo Água Com Gás 500ml (c/ 12)', precoPadrao: 14.00 },
];
    const PRECOS_ESPECIAIS_VENDEDOR = {
  "GUSTAVO": {
    "330ML": 5.30,
    // "900ML": 11.00,
    // "UVA": 5.50,
    // "FARDO_SG": 12.00,
    // "FARDO_CG": 14.00
  }
  // Futuramente, para adicionar outro vendedor, basta copiar a estrutura:
  // "NOME_DO_VENDEDOR": {
  //   "330ML": 5.00,
  //   "900ML": 10.00
  // }
};
    // Fator de conversão de caixas para unidades na Carga Nova
// Apenas produtos definidos aqui serão digitados em caixas no formulário
const CONVERSAO_CAIXAS = {
  '330ML': 80, // 1 caixa = 80 unidades
  '900ML': 25  // 1 caixa = 25 unidades
};

    let bancoDadosRota = [];
    let clienteAtual = null;
    let itensVendaTemp = {};
    let sanfonasAbertas = {};
    let rotaEncerrada = false;

    const fmtMoeda = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    window.onload = function() {
      carregarVendedoresAPI();
    };

    async function carregarVendedoresAPI() {
      const selectVend = document.getElementById('select-vendedor');
      try {
        const res = await fetch(`${URL_API}/vendedores-cidades`);
        const vendedores = await res.json();

        selectVend.innerHTML = '<option value="">-- Selecione o Vendedor --</option>';
        vendedores.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          selectVend.appendChild(opt);
        });
      } catch (e) {
        selectVend.innerHTML = '<option value="">Erro ao carregar vendedores</option>';
      }
    }

    async function carregarRotasDoVendedor(vendedor) {
      const selectRota = document.getElementById('select-rota');
      if (!vendedor) {
        selectRota.innerHTML = '<option value="">Selecione o Vendedor primeiro</option>';
        return;
      }

      selectRota.innerHTML = '<option value="">Carregando rotas/dias...</option>';
      try {
        const res = await fetch(`${URL_API}/vendedores-cidades?vendedor=${encodeURIComponent(vendedor)}`);
        const rotas = await res.json();

        selectRota.innerHTML = '<option value="">-- Selecione a Rota / Dia --</option>';
        rotas.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r;
          opt.textContent = r;
          selectRota.appendChild(opt);
        });
      } catch (e) {
        selectRota.innerHTML = '<option value="">Erro ao carregar rotas</option>';
      }
    }

    async function iniciarRota() {
      const vend = document.getElementById('select-vendedor').value;
      const rotaSel = document.getElementById('select-rota').value;

      if (!vend || !rotaSel) { alert('Selecione o vendedor e a rota/dia!'); return; }

      try {
        const res = await fetch(`${URL_API}/clientes?vendedor=${encodeURIComponent(vend)}&dia_semana=${encodeURIComponent(rotaSel)}`);
        bancoDadosRota = await res.json();

        if (!bancoDadosRota || bancoDadosRota.length === 0) {
          alert('Nenhum cliente encontrado para essa rota!');
          return;
        }

        document.getElementById('header-vendedor').innerText = vend;
        document.getElementById('header-rota').innerText = rotaSel;

        document.getElementById('step-config').classList.add('hidden');

        abrirModalEstoque();
        
      } catch (e) {
        alert("Erro ao buscar rota do servidor: " + e.message);
      }
    }

    function renderizarCidades() {
      const container = document.getElementById('cidades-container');
      container.innerHTML = '';

      bancoDadosRota.forEach((bloco, idx) => {
        const total = bloco.clientes.length;
        const concluidos = bloco.clientes.filter(c => c.status !== 'pendente').length;
        const concluida = concluidos === total && total > 0;

        const card = document.createElement('div');
        card.className = `rounded-xl border transition shadow-sm overflow-hidden ${concluida ? 'bg-green-50 border-green-300' : 'bg-white border-gray-200'}`;

        let htmlClientes = '';
        bloco.clientes.forEach((cli) => {
          let badge = '<span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded font-semibold">Pendente</span>';
          
          if(cli.status === 'vendido') {
            let trocasTotal = Object.values(cli.venda.itens).reduce((acc, i) => acc + i.troca, 0);
            let infoTroca = trocasTotal > 0 ? ` · ${trocasTotal} troca(s)` : '';
            badge = `<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded font-bold">✓ ${fmtMoeda(cli.venda.total)}${infoTroca}</span>`;
          }
          if(cli.status === 'nao_comprou') badge = '<span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded font-medium">Não Comprou</span>';

          htmlClientes += `
            <div onclick="abrirModalVenda(${cli.id})" class="p-3 bg-white border-b last:border-b-0 active:bg-gray-50 flex justify-between items-center cursor-pointer">
              <div>
                <p class="font-bold text-sm text-gray-800">${cli.nome}</p>
              </div>
              <div>${badge}</div>
            </div>`;
        });

        const aberta = sanfonasAbertas[idx] !== false ? '' : 'hidden';

        card.innerHTML = `
          <div onclick="toggleSanfona(${idx})" class="p-4 flex justify-between items-center cursor-pointer ${concluida ? 'bg-green-100/60' : 'bg-gray-50'}">
            <span class="font-bold text-base ${concluida ? 'text-green-800' : 'text-gray-800'}">${bloco.cidade}</span>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${concluida ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-700'}">${concluidos}/${total}</span>
          </div>
          <div id="body-sanfona-${idx}" class="${aberta}">${htmlClientes}</div>`;
        container.appendChild(card);
      });
    }

    function toggleSanfona(idx) {
      sanfonasAbertas[idx] = sanfonasAbertas[idx] === false ? true : false;
      renderizarCidades();
    }

    function abrirModalVenda(clienteId) {
      const vendedorAtual = (document.getElementById('header-vendedor')?.innerText || '').toUpperCase();
      
      for (let bloco of bancoDadosRota) {
        let achado = bloco.clientes.find(c => c.id === clienteId);
        if (achado) { clienteAtual = achado; break; }
      }

      document.getElementById('modal-cliente-nome').innerText = clienteAtual.nome;

      itensVendaTemp = {};
      PRODUTOS_CATALOGO.forEach(p => {
        let precoAplicado = p.precoPadrao;

    // 1. Aplica o Preço Especial do Vendedor (se existir)
    for (let nomeVend in PRECOS_ESPECIAIS_VENDEDOR) {
      if (vendedorAtual.includes(nomeVend)) {
        if (PRECOS_ESPECIAIS_VENDEDOR[nomeVend][p.id] !== undefined) {
          precoAplicado = PRECOS_ESPECIAIS_VENDEDOR[nomeVend][p.id];
        }
      }
    }

    // 2. (Evolução Futura): Se o cliente específico tiver preço próprio, ele sobrescreve aqui
    if (clienteAtual.precosEspeciais && clienteAtual.precosEspeciais[p.id] !== undefined) {
      precoAplicado = clienteAtual.precosEspeciais[p.id];
    }

    itensVendaTemp[p.id] = { qtd: 0, troca: 0, preco: precoAplicado };
  });


      if (clienteAtual.venda) {
        document.getElementById('modal-pagamento').value = clienteAtual.venda.pagamento;
        document.getElementById('modal-obs').value = clienteAtual.venda.obs || '';
        document.getElementById('chk-nota').checked = !!clienteAtual.venda.precisaNota;
        document.getElementById('chk-boleto').checked = !!clienteAtual.venda.precisaBoleto;
        Object.assign(itensVendaTemp, clienteAtual.venda.itens);
      }

      renderizarListaProdutosModal();
      document.getElementById('modal-venda').classList.remove('hidden');
    }

    function fecharModal() { document.getElementById('modal-venda').classList.add('hidden'); }

    function renderizarListaProdutosModal() {
      const container = document.getElementById('produtos-list');
      container.innerHTML = '';

      PRODUTOS_CATALOGO.forEach(prod => {
        const item = itensVendaTemp[prod.id];
        const row = document.createElement('div');
        row.className = 'p-2.5 bg-gray-50 rounded-lg border border-gray-200 space-y-2';
        row.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-xs text-gray-800">${prod.nome}</span>
            <div class="flex items-center space-x-1">
              <span class="text-[10px] font-semibold text-gray-500">R$:</span>
              <input type="number" inputmode="decimal" step="0.50" value="${item.preco}" onchange="alterarPreco('${prod.id}', this.value)" class="w-16 p-1 text-xs font-bold text-right border border-gray-300 rounded bg-white">
            </div>
          </div>
          <div class="flex justify-between items-center text-xs">
            <div class="flex items-center space-x-1">
              <span class="text-[10px] text-red-600 font-bold">Troca:</span>
              <input type="number" inputmode="numeric" min="0" value="${item.troca}" onchange="alterarTroca('${prod.id}', this.value)" class="w-12 p-1 text-center font-semibold border border-red-200 rounded bg-red-50 text-red-700">
            </div>
            <div class="flex items-center border rounded-lg bg-white overflow-hidden shadow-sm">
              <button onclick="alterarQtd('${prod.id}', -1)" class="px-3 py-1 bg-gray-100 font-bold text-gray-600">-</button>
              <span class="px-3 font-bold text-sm">${item.qtd}</span>
              <button onclick="alterarQtd('${prod.id}', 1)" class="px-3 py-1 bg-blue-100 font-bold text-blue-700">+</button>
            </div>
          </div>`;
        container.appendChild(row);
      });
      recalcularTotalModal();
    }

    function alterarPreco(prodId, val) {
      const num = parseFloat(val.replace(',', '.'));
      if(!isNaN(num) && num >= 0) { itensVendaTemp[prodId].preco = num; recalcularTotalModal(); }
    }

    function alterarTroca(prodId, val) {
      const num = parseInt(val);
      if(!isNaN(num) && num >= 0) { itensVendaTemp[prodId].troca = num; recalcularTotalModal(); }
    }

    function alterarQtd(prodId, delta) {
      if (itensVendaTemp[prodId].qtd + delta >= 0) {
        itensVendaTemp[prodId].qtd += delta;
        renderizarListaProdutosModal();
      }
    }

    function recalcularTotalModal() {
      let total = 0;
      PRODUTOS_CATALOGO.forEach(p => {
        const item = itensVendaTemp[p.id];
        total += Math.max(0, item.qtd - item.troca) * item.preco;
      });
      document.getElementById('modal-total-val').innerText = fmtMoeda(total);
      return total;
    }

    async function salvarVenda(teveVenda) {
      let cidadeCliente = "";
  
  for (let bloco of bancoDadosRota) {
    if (bloco.clientes.some(c => c.id === clienteAtual.id)) {
      cidadeCliente = bloco.cidade;
      break;
    }
  }
      if (!teveVenda) {
        clienteAtual.status = 'nao_comprou';
        clienteAtual.venda = null;
      } else {
        clienteAtual.status = 'vendido';
        clienteAtual.venda = {
          total: recalcularTotalModal(),
          pagamento: document.getElementById('modal-pagamento').value,
          obs: document.getElementById('modal-obs').value,
          precisaNota: document.getElementById('chk-nota').checked,
          precisaBoleto: document.getElementById('chk-boleto').checked,
          itens: JSON.parse(JSON.stringify(itensVendaTemp))
        };
      }
      // Disparo em tempo real para o Supabase
  await salvarClienteAoVivo({
    vendedor: document.getElementById('header-vendedor').innerText,
    clienteId: clienteAtual.id,
    clienteNome: clienteAtual.nome,
    cidade: cidadeCliente,
    statusAtendimento: teveVenda ? 'CONCLUIDO' : 'NAO_COMPROU',
    valorTotal: teveVenda ? clienteAtual.venda.total : 0,
    formaPagamento: teveVenda ? clienteAtual.venda.pagamento : 'N/A',
    observacao: document.getElementById('modal-obs').value,
    precisaNota: teveVenda ? document.getElementById('chk-nota').checked : false,
    precisaBoleto: teveVenda ? document.getElementById('chk-boleto').checked : false,
    qtd_330ml: teveVenda ? (itensVendaTemp['330ML']?.qtd || 0) : 0,
    qtd_900ml: teveVenda ? (itensVendaTemp['900ML']?.qtd || 0) : 0,
    qtd_uva: teveVenda ? (itensVendaTemp['UVA']?.qtd || 0) : 0,
    qtd_agua_sg: teveVenda ? (itensVendaTemp['FARDO_SG']?.qtd || 0) : 0,
    qtd_agua_cg: teveVenda ? (itensVendaTemp['FARDO_CG']?.qtd || 0) : 0,
    troca_330ml: teveVenda ? (itensVendaTemp['330ML']?.troca || 0) : 0,
    troca_900ml: teveVenda ? (itensVendaTemp['900ML']?.troca || 0) : 0,
    troca_uva: teveVenda ? (itensVendaTemp['UVA']?.troca || 0) : 0
  });
      fecharModal();
      renderizarCidades();
    }
    
    function resetarDadosSimulacao() { location.reload(); }
    function voltarConfig() {
      document.getElementById('step-config').classList.remove('hidden');
      document.getElementById('step-rota').classList.add('hidden');
      document.getElementById('box-fechamento').classList.add('hidden');
    }
    
    
    // Função para gerar e baixar o relatório HTML
    function baixarRelatorioFechamento(dados) {
  const dataHoje = new Date().toLocaleDateString('pt-BR');

  // 1. Monta as linhas da tabela de clientes atendidos
  const clientesHTML = (dados.clientes && dados.clientes.length > 0)
    ? dados.clientes.map(c => `
      <tr>
        <td><strong>${c.clienteNome || c.nome || '-'}</strong><br><small>${c.cidade || ''}</small></td>
        <td>
          330ml: ${c.qtd_330ml || 0}<br>
          900ml: ${c.qtd_900ml || 0}<br>
          Uva: ${c.qtd_uva || 0}
        </td>
        <td>
          330ml: ${c.troca_330ml || 0}<br>
          900ml: ${c.troca_900ml || 0}<br>
          Uva: ${c.troca_uva || 0}
        </td>
        <td>${c.formaPagamento || c.forma_pagamento || '-'}</td>
        <td><strong>R$ ${Number(c.valorTotal || c.valor_total || 0).toFixed(2)}</strong></td>
        <td>${c.observacao || '-'}</td>
      </tr>
    `).join('')
    : '<tr><td colspan="6" style="text-align:center;">Nenhum cliente registrado no fechamento.</td></tr>';

  // 2. Monta as linhas das despesas (se houver)
  const despesasHTML = (dados.despesas && dados.despesas.length > 0)
    ? dados.despesas.map(d => `
      <tr>
        <td>${d.descricao || d.motivo || '-'}</td>
        <td>R$ ${Number(d.valor || 0).toFixed(2)}</td>
      </tr>
    `).join('')
    : '<tr><td colspan="2" style="text-align:center;">Nenhuma despesa lançada.</td></tr>';

  // 3. Calcula o total geral de vendas
  const totalVendas = (dados.clientes || []).reduce((acc, c) => acc + Number(c.valorTotal || c.valor_total || 0), 0);
  const totalDespesas = (dados.despesas || []).reduce((acc, d) => acc + Number(d.valor || 0), 0);
  const valorLiquido = totalVendas - totalDespesas;

  // 4. Conteúdo formatado para Impressão / Salvar em PDF
  const conteudo = `
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>Comprovante de Fechamento - ${dados.vendedor} - ${dataHoje}</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 20px; color: #111; font-size: 13px; }
        .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
        .header h2 { margin: 0; text-transform: uppercase; font-size: 18px; }
        .box-info { background: #f8f9fa; border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        h3 { border-bottom: 1px solid #000; padding-bottom: 3px; margin-top: 20px; font-size: 14px; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { border: 1px solid #999; padding: 6px; text-align: left; vertical-align: top; }
        th { background: #eee; font-size: 12px; }
        .resumo { margin-top: 20px; border: 2px solid #000; padding: 10px; background: #fff; }
        .resumo p { margin: 4px 0; font-size: 14px; }
        @media print {
          body { padding: 0; }
          .no-print { display: none; }
        }
      </style>
    </head>
    <body>
      <div class="header">
        <h2>Comprovante de Fechamento de Rota</h2>
        <p style="margin: 3px 0;">Distribuição de Sucos</p>
      </div>

      <div class="box-info">
        <span><strong>Vendedor:</strong> ${dados.vendedor || 'Não informado'}</span>
        <span><strong>Data do Fechamento:</strong> ${dataHoje}</span>
      </div>

      <h3>1. Clientes Atendidos e Vendas</h3>
      <table>
        <thead>
          <tr>
            <th>Cliente / Cidade</th>
            <th>Vendas (Qtd)</th>
            <th>Trocas (Qtd)</th>
            <th>Pagamento</th>
            <th>Valor Total</th>
            <th>Observações</th>
          </tr>
        </thead>
        <tbody>
          ${clientesHTML}
        </tbody>
      </table>

      <h3>2. Despesas da Rota</h3>
      <table>
        <thead>
          <tr>
            <th>Descrição / Motivo</th>
            <th>Valor (R$)</th>
          </tr>
        </thead>
        <tbody>
          ${despesasHTML}
        </tbody>
      </table>

      <div class="resumo">
        <p><strong>Total Bruto de Vendas:</strong> R$ ${totalVendas.toFixed(2)}</p>
        <p><strong>Total de Despesas:</strong> R$ ${totalDespesas.toFixed(2)}</p>
        <p style="font-size: 16px; margin-top: 8px;"><strong>Valor Líquido a Prestar Contas:</strong> R$ ${valorLiquido.toFixed(2)}</p>
      </div>

      <script>
        window.onload = function() {
          window.print();
        };
      <\/script>
    </body>
    </html>
  `;

  // Abre uma janela para visualização e aciona a caixa de diálogo "Salvar como PDF / Imprimir"
  const janela = window.open('', '_blank');
  janela.document.write(conteudo);
  janela.document.close();
}

    // Lógica de finalizar e resetar o aplicativo
async function concluirEBloquearFechamento() {
  const vendedorNome = document.getElementById('header-vendedor')?.innerText || 'Vendedor';
  
  const confirmou = confirm("Deseja realmente concluir o fechamento do dia? O aplicativo será resetado e travado.");
  if (!confirmou) return;

  // Baixa o relatório para o celular do vendedor
  let clientesAtendidos = [];
  if (typeof bancoDadosRota !== 'undefined') {
    bancoDadosRota.forEach(bloco => {
      bloco.clientes.forEach(c => {
        if (c.status === 'vendido' && c.venda) {
          clientesAtendidos.push({
            clienteNome: c.nome,
            cidade: bloco.cidade,
            formaPagamento: c.venda.pagamento,
            valorTotal: c.venda.total,
            observacao: c.venda.obs,
            qtd_330ml: c.venda.itens['330ML']?.qtd || 0,
            qtd_900ml: c.venda.itens['900ML']?.qtd || 0,
            qtd_uva: c.venda.itens['UVA']?.qtd || 0,
            troca_330ml: c.venda.itens['330ML']?.troca || 0,
            troca_900ml: c.venda.itens['900ML']?.troca || 0,
            troca_uva: c.venda.itens['UVA']?.troca || 0
          });
        }
      });
    });
  }

  // Garante que listaDespesas existe antes de passar para o PDF para não quebrar o código
  const despesasFinal = (typeof listaDespesas !== 'undefined') ? listaDespesas : [];

  // 2. Dispara a geração do PDF enviando os dados completos
  try {
    if (typeof baixarRelatorioFechamento === 'function') {
      baixarRelatorioFechamento({
        vendedor: vendedorNome,
        clientes: clientesAtendidos,
        despesas: despesasFinal
      });
    }
  } catch (errPdf) {
    console.error("Erro ao gerar o PDF:", errPdf);
  }

  alert("Fechamento enviado com sucesso para o escritório!");

  // Limpa o armazenamento local do navegador e recarrega a página zerada
  localStorage.clear();
  window.location.reload();
}

// Chame esta função NO LUGAR da função que antes liberava a tela da rota direto.
function abrirModalEstoque() {
  document.getElementById('modalEstoqueInicial').classList.remove('hidden');
}

async function salvarEstoqueInicial() {
  const vendedorAtual = document.getElementById('header-vendedor').innerText;

  const cxCarga330ml = Number(document.getElementById('carga_330ml').value) || 0;
  const cxCarga900ml = Number(document.getElementById('carga_900ml').value) || 0;
  
  // Pega os valores, se estiver vazio vira 0
  const dadosEstoque = {
    vendedor_nome: vendedorAtual, // Certifique-se que esta variável existe no seu escopo global
    data_fechamento: new Date().toISOString().split('T')[0], // Data de hoje formato YYYY-MM-DD
    retorno_declarado_330ml: Number(document.getElementById('retorno_330ml').value) || 0,
    carga_330ml:cxCarga330ml * (CONVERSAO_CAIXAS['330ML'] || 80),
    retorno_declarado_900ml: Number(document.getElementById('retorno_900ml').value) || 0,
    carga_900ml:cxCarga900ml * (CONVERSAO_CAIXAS['900ML'] || 25),
    retorno_declarado_uva: Number(document.getElementById('retorno_uva').value) || 0,
    carga_uva: Number(document.getElementById('carga_uva').value) || 0,
    retorno_declarado_agua: Number(document.getElementById('retorno_agua').value) || 0,
    carga_agua: Number(document.getElementById('carga_agua').value) || 0,
    retorno_declarado_agua_gas: Number(document.getElementById('retorno_agua_gas').value) || 0,
    carga_agua_gas: Number(document.getElementById('carga_agua_gas').value) || 0,
  };

  try {
    // Insere ou atualiza o fechamento do dia para este vendedor
    const { data, error } = await supabaseClient
      .from('fechamentos')
      .insert([dadosEstoque])

    if (error) throw error;
    
    alert("Estoque inicial gravado com sucesso! Boa rota.");
    document.getElementById('modalEstoqueInicial').classList.add('hidden');
    
    document.getElementById('step-rota').classList.remove('hidden');
    document.getElementById('box-fechamento').classList.remove('hidden');
    
    renderizarCidades();
    
  } catch (err) {
    console.error("Erro ao salvar estoque:", err);
    alert("Erro ao gravar estoque. Tente novamente.");
  }
}

// --- LÓGICA DE DESPESAS ---

function toggleDespesas() {
  const cont = document.getElementById('conteudo-despesas');
  const icone = document.getElementById('icone-despesa');
  if (cont.classList.contains('hidden')) {
    cont.classList.remove('hidden');
    icone.innerText = '▲';
  } else {
    cont.classList.add('hidden');
    icone.innerText = '▼';
  }
}

async function salvarDespesas() {
  const vendedorAtual = document.getElementById('header-vendedor').innerText;
  const combustivel = parseFloat(document.getElementById('despesa_combustivel').value) || 0;
  const almoco = parseFloat(document.getElementById('despesa_almoco').value) || 0;
  const outras = parseFloat(document.getElementById('despesa_outras_valor').value) || 0;
  const obs = document.getElementById('despesa_outras_obs').value;

  if (outras > 0 && obs.trim() === "") {
    alert("Por favor, descreva do que se trata a despesa em 'Outras'.");
    return;
  }

  const hoje = new Date().toISOString().split('T')[0];

  try {
    const { error } = await supabaseClient
      .from('fechamentos')
      .update({
        despesa_combustivel: combustivel,
        despesa_almoco: almoco,
        despesa_outras_valor: outras,
        despesa_outras_obs: obs
      })
      .eq('vendedor_nome', vendedorAtual)
      .eq('data_fechamento', hoje);

    if (error) throw error;
    
    alert("Despesas salvas com sucesso!");
    toggleDespesas(); // Fecha a sanfona
  } catch (err) {
    console.error("Erro ao salvar despesas:", err);
    alert("Erro ao salvar as despesas. Verifique a internet.");
  }
}
